<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>내 계좌</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .account-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .account-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 한 줄에 2개 고정 */
      gap: 24px;
    }

    .account-card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    .account-card h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .account-card p {
      margin: 2px 0;
      font-size: 14px;
      color: #333;
    }

    .account-card .balance {
      font-size: 24px;
      font-weight: bold;
      margin: 14px 0 6px;
      color: #000;
    }

    .account-card button {
      margin-top: 16px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }

    .create-btn {
      padding: 10px 16px;
      background: black;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="container">
  <aside class="sidebar">
    <h2>🔒 안전한 은행</h2>
        <a href="/dashboard">📊 대시보드</a>
        <a href="/accounts">💳 계좌</a>
        <a href="/transfer" class="active">🔁 이체</a>
        <a href="/transactions">📉 거래 내역</a>
        <a href="/deposit">📤 입금</a>
        <a href="/withdraw">📥 출금</a>
        <a href="/settings">⚙️ 설정</a>
  </aside>

  <main class="main">
    <div class="account-header">
      <div>
        <h2>내 계좌</h2>
        <p>모든 계좌를 관리하고 새 계좌를 개설하세요.</p>
      </div>
      <button class="create-btn" onclick="location.href='/create-account'">＋ 새 계좌 개설</button>
    </div>

    <!-- 계좌 없을 경우 메시지 -->
    <div th:if="${#lists.isEmpty(accounts)}">
      <p>등록된 계좌가 없습니다.</p>
    </div>

    <!-- 계좌 목록 -->
    <div class="account-grid" th:if="${not #lists.isEmpty(accounts)}">
      <div class="account-card" th:each="acc : ${accounts}">
        <h3 th:text="${acc.accountName}">계좌명</h3>
        <p th:text="'계좌번호: ' + ${acc.accountNumber}">123-456-789012</p>
        <p class="balance" th:text="'₩' + ${acc.balance}">₩1,500,000</p>
        <p th:text="'개설일: ' + ${#temporals.format(acc.createdAt, 'yyyy-MM-dd')}">2025-06-07</p>

        <!-- 안전한 onclick 처리 -->
        <button
          th:attr="onclick='location.href=&quot;/account/detail?accountNumber=' + ${acc.accountNumber} + '&quot;'">
          상세 보기
        </button>
      </div>
    </div>
  </main>
</div>
</body>
</html>

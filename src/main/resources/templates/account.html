<!-- templates/account.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 계좌</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="flex">
    <!-- 사이드바 -->
    <div class="w-64 bg-white border-r h-screen p-4">
        <h2 class="text-lg font-bold mb-6">🔒 안전한 은행</h2>
        <ul class="space-y-4 text-sm font-medium">
            <li><a href="/dashboard" class="flex items-center gap-2">📊 대시보드</a></li>
            <li><a href="/accounts" class="flex items-center gap-2 text-blue-600">💳 계좌</a></li>
            <li><a href="/transfer" class="flex items-center gap-2">🔁 이체</a></li>
            <li><a href="/transactions" class="flex items-center gap-2">📉 거래 내역</a></li>
            <li><a href="/deposit" class="flex items-center gap-2">📤 입금</a></li>
            <li><a href="/withdraw" class="flex items-center gap-2">📥 출금</a></li>
            <li><a href="/settings" class="flex items-center gap-2">⚙️ 설정</a></li>
        </ul>
    </div>

    <!-- 메인 -->
    <div class="flex-1 p-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold">내 계좌</h1>
            <a href="/create" class="bg-black text-white px-4 py-2 rounded-md flex items-center gap-2 text-sm">
                ➕ 새 계좌 개설
            </a>
        </div>
        <p class="text-gray-500 text-sm mt-1 mb-6">모든 계좌를 관리하고 새 계좌를 개설하세요.</p>

        <div class="grid grid-cols-2 gap-6">
	    <div th:each="acc : ${accounts}" class="bg-white rounded-xl border p-6 space-y-2">
	        <h2 class="text-xl font-semibold" th:text="${acc.ownerName}">주계좌</h2>
	        <div class="text-sm text-gray-500">
	            계좌번호: <span th:text="${acc.accountNumber}">123-456</span>
	        </div>
	        <div class="text-2xl font-bold" th:text="|₩${#numbers.formatDecimal(acc.balance, 0, 0)}|">₩0</div>
	        <div class="text-sm text-gray-400">
	            개설일: <span th:text="${#temporals.format(acc.createdAt, 'yyyy/MM/dd')}">날짜</span>
	        </div>
	        <a href="/account/detail" class="block text-center mt-4 border rounded py-1">상세 보기</a>
	    </div>
	</div>

    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>계좌 상세</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-green { background-color: #4caf50; color: #fff; }
        .badge-red { background-color: #f44336; color: #fff; }

        .filter-buttons {
            margin: 10px 0;
        }
        .filter-buttons button {
            margin-right: 8px;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #eee;
        }
        .filter-buttons button.active {
            background-color: #000;
            color: #fff;
        }

        .text-red { color: #f44336; }
        .text-green { color: #4caf50; }

        .delete-btn {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .delete-btn button {
            background: #e53935;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 사이드바 -->
    <aside class="sidebar">
        <h2>🔒 안전한 은행</h2>
        <a href="/dashboard">📊 대시보드</a>
        <a href="/accounts">💳 계좌</a>
        <a href="/transfer" class="active">🔁 이체</a>
        <a href="/transactions">📉 거래 내역</a>
        <a href="/deposit">📤 입금</a>
        <a href="/withdraw">📥 출금</a>
        <a href="/settings">⚙️ 설정</a>
    </aside>

    <!-- 본문 -->
    <main class="main" style="position: relative;">
        <div class="section-title">계좌 상세</div>
        <p class="text-sm text-gray-500" th:text="|계좌번호: ${account.accountNumber}|">계좌번호</p>

        <!-- 삭제 버튼 -->
        <div class="delete-btn">
            <form th:action="@{/account/delete}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?')">
                <input type="hidden" name="accountNumber" th:value="${account.accountNumber}">
                <button type="submit">계좌 삭제</button>
            </form>
        </div>

        <!-- 계좌 정보 / 계좌 관리 -->
        <div class="card-grid">
            <!-- 계좌 정보 -->
            <div class="card">
                <div class="card-title">계좌 정보</div>
                <p><strong>계좌 이름:</strong> <span th:text="${account.accountName}">급여 계좌</span></p>
                <p><strong>계좌 유형:</strong> <span th:text="${account.accountType}">입출금</span></p>
                <p>
				    <strong>현재 잔액:</strong>
				    <span th:text="${'₩' + T(java.lang.String).format('%,d', T(java.lang.Math).round(account.balance))}">
				        ₩0
				    </span>
				</p>
                <p><strong>개설일:</strong> <span th:text="${#temporals.format(account.createdAt, 'yyyy-MM-dd')}">2025-06-08</span></p>
                <p>
                    <strong>상태:</strong>
                    <span th:if="${account.active}" class="badge badge-green">활성</span>
                    <span th:unless="${account.active}" class="badge badge-red">비활성</span>
                </p>
            </div>

            <!-- 계좌 관리 -->
            <div class="card">
                <div class="card-title">계좌 관리</div>
                <form method="post">
                    <input type="hidden" name="accountNumber" th:value="${account.accountNumber}" />
                    <div class="button-group">
                        <button type="submit" formaction="/account/deposit" th:disabled="${!account.active}">입금</button>
                        <button type="submit" formaction="/account/withdraw" th:disabled="${!account.active}">출금</button>
                    </div>
                    <label for="amount">금액</label>
                    <input type="number" name="amount" class="input" required th:disabled="${!account.active}">
                    <label for="description">내용</label>
                    <textarea name="description" class="input" placeholder="입금/출금 내용을 입력하세요." th:disabled="${!account.active}"></textarea>
                </form>
            </div>
        </div>

        <!-- 거래 내역 -->
        <div class="card">
            <div class="card-title">거래 내역</div>
            <div class="filter-buttons">
                <button class="active" data-filter="ALL">모든 거래</button>
                <button data-filter="DEPOSIT">입금</button>
                <button data-filter="WITHDRAW">출금</button>
                <button data-filter="TRANSFER">이체</button>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th>날짜</th>
                        <th>설명</th>
                        <th>유형</th>
                        <th>계좌</th>
                        <th>금액</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tx : ${transactions}" th:attr="data-type=${tx.type}">
                        <td th:text="${#temporals.format(tx.date, 'yyyy-MM-dd')}">2025-06-08</td>
                        <td th:text="${tx.description}">설명</td>
                        <td th:switch="${tx.type}">
                            <span th:case="'DEPOSIT'">입금</span>
                            <span th:case="'WITHDRAW'">출금</span>
                            <span th:case="'TRANSFER'">이체</span>
                            <span th:case="*">기타</span>
                        </td>
                        <td th:text="${tx.accountNumber}">123-456-789012</td>
                        <td th:text="${tx.amount < 0 ? '-₩' + T(java.lang.String).format('%,d', T(java.lang.Math).round(-tx.amount)) : '+₩' + T(java.lang.String).format('%,d', T(java.lang.Math).round(tx.amount))}"
                            th:classappend="${tx.amount < 0} ? 'text-red' : 'text-green'">
                            +₩100000
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const buttons = document.querySelectorAll('.filter-buttons button');
        const rows = document.querySelectorAll('tbody tr');

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                buttons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                const filter = button.dataset.filter;

                rows.forEach(row => {
                    const type = row.dataset.type;
                    if (filter === 'ALL' || type === filter) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });
        });
    });
</script>
</body>
</html>

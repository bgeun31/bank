<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대시보드</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .type-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: #fff;
            font-weight: bold;
        }
        .badge-deposit {
            background: #4caf50;
        }
        .badge-withdraw {
            background: #f44336;
        }
        .badge-transfer {
            background: #2196f3;
        }
        .amount {
            font-weight: bold;
        }
        .text-red {
            color: #f44336;
        }
        .text-green {
            color: #4caf50;
        }
        .text-center {
            text-align: center;
            color: #777;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 사이드바 -->
    <aside class="sidebar">
        <h2>🔒 안전한 은행</h2>
        <a href="/dashboard" class="active">📊 대시보드</a>
        <a href="/accounts">💳 계좌</a>
        <a href="/transfer">🔁 이체</a>
        <a href="/transactions">📉 거래 내역</a>
        <a href="/deposit">📤 입금</a>
        <a href="/withdraw">📥 출금</a>
        <a href="/settings">⚙️ 설정</a>
    </aside>

    <!-- 메인 -->
    <main class="main">
        <div class="section-title"><strong>대시보드</strong></div>
        <p>계좌 정보와 최근 거래 내역을 확인하세요.</p>

        <div class="card-grid">
            <div class="card">
                <div class="card-title">총 자산</div>
                <div th:text="${'₩ ' + T(java.lang.String).format('%,d', T(java.lang.Math).round(totalBalance))}">
                    ₩0
                </div>
            </div>
            <div class="card">
                <div class="card-title">계좌 수</div>
                <div th:text="${accountCount}">0</div>
            </div>
            <div class="card">
                <div class="card-title">최근 거래</div>
                <div th:text="${recentTransactionCount}">0</div>
            </div>
        </div>

        <div class="card-grid">
            <div class="card account-list">
                <div class="card-title">내 계좌</div>

                <ul class="accounts" th:if="${#lists.isEmpty(accounts)}">
				    <li class="centered-message">계좌가 없습니다. 새 계좌를 개설해보세요.</li>
				</ul>
                <ul class="accounts" th:each="acc : ${accounts}" th:unless="${#lists.isEmpty(accounts)}">
                    <li class="account-item">
                        <div class="acc-label">
                            <span class="acc-name" th:text="${acc.accountName}">주계좌</span>
                            <span class="acc-number" th:text="${acc.accountNumber}">774-474-598</span>
                        </div>
                        <div class="acc-balance"
                             th:text="${'₩ ' + T(java.lang.String).format('%,d', T(java.lang.Math).round(acc.balance))}">
                            ₩5,000
                        </div>
                    </li>
                </ul>
            </div>

            <div class="card quick-menu">
                <div class="card-title">빠른 메뉴</div>
                <button onclick="location.href='/deposit'">입금</button>
                <button onclick="location.href='/withdraw'">출금</button>
                <button onclick="location.href='/transfer'">이체</button>
                <button onclick="location.href='/create-account'">계좌 개설</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">최근 거래</div>
            <table class="table">
                <thead>
                <tr>
                    <th>날짜</th>
                    <th>설명</th>
                    <th>유형</th>
                    <th>계좌</th>
                    <th>금액</th>
                </tr>
                </thead>
                <tbody th:if="${#lists.isEmpty(recentTransactions)}">
                <tr>
                    <td colspan="5" class="text-center">표시할 거래 내역이 없습니다.</td>
                </tr>
                </tbody>
                <tbody th:each="tx : ${recentTransactions}" th:unless="${#lists.isEmpty(recentTransactions)}">
                <tr>
                    <td th:text="${#temporals.format(tx.date, 'yyyy-MM-dd HH:mm')}">2025-06-08</td>
                    <td th:text="${tx.description}">적금 이체</td>
                    <td th:switch="${tx.type}">
                        <span th:case="'DEPOSIT'" class="type-badge badge-deposit">입금</span>
                        <span th:case="'WITHDRAW'" class="type-badge badge-withdraw">출금</span>
                        <span th:case="'TRANSFER'" class="type-badge badge-transfer">이체</span>
                        <span th:case="*">기타</span>
                    </td>
                    <td th:text="${tx.accountNumber}">123-456-789012</td>
                    <td class="amount"
                        th:classappend="${tx.amount < 0} ? 'text-red' : 'text-green'"
                        th:text="${tx.amount < 0
                                   ? '-₩' + T(java.lang.String).format('%,d', T(java.lang.Math).round(-tx.amount))
                                   : '+₩' + T(java.lang.String).format('%,d', T(java.lang.Math).round(tx.amount))}">
                        +₩100,000
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>

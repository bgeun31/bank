<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>대시보드</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <h2>🔒 안전한 은행</h2>
        <a href="/dashboard" class="active">📊 대시보드</a>
        <a href="/accounts">💳 계좌</a>
        <a href="/transfer">🔁 이체</a>
        <a href="/transactions">📉 거래 내역</a>
        <a href="/deposit">📤 입금</a>
        <a href="/withdraw">📥 출금</a>
        <a href="/settings">⚙️ 설정</a>
    </aside>

    <main class="main">
        <div class="section-title">대시보드</div>
        <p>계좌 정보와 최근 거래 내역을 확인하세요.</p>

        <div class="card-grid">
            <div class="card">
                <div class="card-title">총 자산</div>
                <div th:text="'₩' + ${totalBalance}">₩6,500,000</div>
            </div>
            <div class="card">
                <div class="card-title">계좌 수</div>
                <div th:text="${accountCount}">2</div>
            </div>
            <div class="card">
                <div class="card-title">최근 거래</div>
                <div th:text="${recentTransactionCount}">3</div>
            </div>
        </div>

        <div class="card-grid">
            <div class="card">
                <div class="card-title">내 계좌</div>
                <p th:each="acc : ${accounts}">
                    <span th:text="${acc.name}">주계좌</span><br/>
                    <span th:text="${acc.number}">123-456-789012</span><br/>
                    <span th:text="'₩' + ${acc.balance}">₩1,500,000</span><br/><br/>
                </p>
                <button>새 계좌 개설</button>
            </div>

            <div class="card quick-menu">
                <div class="card-title">빠른 메뉴</div>
                <button onclick="location.href='/deposit'">입금</button>
                <button onclick="location.href='/withdraw'">출금</button>
                <button onclick="location.href='/transfer'">이체</button>
                <button onclick="location.href='/create-account'">계좌 개설</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">최근 거래</div>
            <table class="table">
                <thead>
                    <tr>
                        <th>날짜</th>
                        <th>설명</th>
                        <th>유형</th>
                        <th>계좌</th>
                        <th>금액</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="tx : ${recentTransactions}">
                        <td th:text="${tx.date}">6/7/2025</td>
                        <td th:text="${tx.description}">적금 이체</td>
                        <td th:text="${tx.type}">이체</td>
                        <td th:text="${tx.accountNumber}">123-456-789013</td>
                        <td th:text="${tx.amount}">-₩200,000</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>

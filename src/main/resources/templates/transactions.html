<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>거래 내역</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filters button {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            background: #eee;
            cursor: pointer;
        }

        .filters button.active {
            background: #000;
            color: #fff;
        }

        .transactions-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
        }

        .transactions-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .transactions-table th,
        .transactions-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        .amount {
            font-weight: bold;
        }

        .text-red {
            color: #f44336;
        }

        .text-green {
            color: #4caf50;
        }

        .type-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: #fff;
        }

        .badge-deposit {
            background: #4caf50;
        }

        .badge-withdraw {
            background: #f44336;
        }

        .badge-transfer {
            background: #2196f3;
        }
    </style>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <h2>🔒 안전한 은행</h2>
        <a href="/sskm0116/dashboard">📊 대시보드</a>
        <a href="/sskm0116/accounts">💳 계좌</a>
        <a href="/sskm0116/transfer">🔁 이체</a>
        <a href="/sskm0116/transactions" class="active">📉 거래 내역</a>
        <a href="/sskm0116/deposit">📤 입금</a>
        <a href="/sskm0116/withdraw">📥 출금</a>
        <a href="/sskm0116/settings">⚙️ 설정</a>
    </aside>

    <main class="main">
        <h1 class="section-title">거래 내역</h1>
        <p>모든 계좌의 거래 내역을 확인하세요.</p>

        <div class="filters">
            <button class="active" data-filter="ALL">전체</button>
            <button data-filter="DEPOSIT">입금</button>
            <button data-filter="WITHDRAW">출금</button>
            <button data-filter="TRANSFER">이체</button>
        </div>

        <div class="transactions-card">
            <h2>거래 내역</h2>
            <table class="transactions-table">
                <thead>
                <tr>
                    <th>날짜</th>
                    <th>설명</th>
                    <th>유형</th>
                    <th>계좌</th>
                    <th>금액</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tx : ${transactions}" th:attr="data-type=${tx.type}">
                    <td th:text="${#temporals.format(tx.date, 'yyyy/MM/dd')}">2025/06/08</td>
                    <td>
					    <span th:if="${tx.description != null and !tx.description.isEmpty()}"
					          th:text="${tx.description}">설명</span>
					    <span th:unless="${tx.description != null and !tx.description.isEmpty()}">설명 없음</span>
					</td>

                    <td th:switch="${tx.type}">
                        <span th:case="'DEPOSIT'"  class="type-badge badge-deposit">입금</span>
                        <span th:case="'WITHDRAW'" class="type-badge badge-withdraw">출금</span>
                        <span th:case="'TRANSFER'" class="type-badge badge-transfer">이체</span>
                        <span th:case="*">기타</span>
                    </td>
                    <td th:text="${tx.accountNumber}">계좌번호</td>
                    <td class="amount"
                        th:classappend="${tx.amount < 0} ? 'text-red' : 'text-green'"
                        th:text="${tx.amount < 0
                                   ? '-₩' + T(java.lang.String).format('%,d', T(java.lang.Math).round(-tx.amount))
                                   : '+₩' + T(java.lang.String).format('%,d', T(java.lang.Math).round(tx.amount))}">
                        +₩100,000
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const buttons = document.querySelectorAll('.filters button');
        const rows = document.querySelectorAll('tbody tr');

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filter = btn.dataset.filter;

                rows.forEach(row => {
                    const type = row.dataset.type;
                    if (filter === 'ALL' || type === filter) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });
        });
    });
</script>
</body>
</html>

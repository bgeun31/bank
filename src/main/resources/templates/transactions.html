<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>거래 내역</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .filters{display:flex;gap:8px;margin-bottom:20px}
        .filters button{padding:8px 14px;border:none;border-radius:6px;background:#eee;cursor:pointer}
        .filters button.active{background:#000;color:#fff}

        .transactions-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
        .transactions-table{width:100%;border-collapse:collapse;font-size:14px}
        .transactions-table th,.transactions-table td{padding:12px;border-bottom:1px solid #eee;text-align:left}

        .amount{font-weight:bold}
        .text-red{color:#f44336}
        .text-green{color:#4caf50}

        .type-badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:12px;color:#fff}
        .badge-deposit{background:#4caf50}
        .badge-withdraw{background:#f44336}
        .badge-transfer{background:#2196f3}
    </style>
</head>
<body>
<div class="container">
    <!-- 사이드바 -->
    <aside class="sidebar">
        <h2>🔒 안전한 은행</h2>
        <a href="/dashboard">📊 대시보드</a>
        <a href="/accounts">💳 계좌</a>
        <a href="/transfer">🔁 이체</a>
        <a href="/transactions" class="active">📉 거래 내역</a>
        <a href="/deposit">📤 입금</a>
        <a href="/withdraw">📥 출금</a>
        <a href="/settings">⚙️ 설정</a>
    </aside>

    <!-- 메인 -->
    <main class="main">
        <h1 class="section-title">거래 내역</h1>
        <p>모든 계좌의 거래 내역을 확인하세요.</p>

        <div class="filters">
            <button class="active">전체</button>
            <button>입금</button>
            <button>출금</button>
            <button>이체</button>
        </div>

        <div class="transactions-card">
            <h2>거래 내역</h2>
            <table class="transactions-table">
                <thead>
                <tr>
                    <th>날짜</th>
                    <th>설명</th>
                    <th>유형</th>
                    <th>계좌</th>
                    <th>금액</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tx : ${transactions}">
                    <td th:text="${#temporals.format(tx.date, 'yyyy/MM/dd')}">2025/06/08</td>
                    <td th:text="${tx.description}">설명</td>

                    <!-- 유형 배지 -->
                    <td>
                        <span class="type-badge"
                              th:classappend="${tx.type}=='입금' ? 'badge-deposit' :
                                              (tx.type=='출금' ? 'badge-withdraw' : 'badge-transfer')"
                              th:text="${tx.type}">입금</span>
                    </td>

                    <td th:text="${tx.accountNumber}">계좌번호</td>

                    <!-- 금액 (콤마, ±부호, 색상) -->
					<td class="amount"
					    th:classappend="${tx.amount < 0} ? 'text-red' : 'text-green'"
					    th:text="${tx.amount < 0
					               ? '-₩' + T(java.lang.String).format('%,d', T(java.lang.Math).round(-tx.amount))
					               : '+₩' + T(java.lang.String).format('%,d', T(java.lang.Math).round(tx.amount))}">
					    +₩100,000
					</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>

<!-- templates/create-account.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>새 계좌 개설</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="form-box">
        <h2>새 계좌 개설</h2>
        <p>새로운 은행 계좌를 개설하세요.</p>

        <form th:action="@{/create}" method="post">
            <label for="accountName">계좌 이름</label>
            <input type="text" id="accountName" name="accountName" placeholder="급여 계좌" required>
            <p class="desc">계좌를 구분하기 위한 이름을 입력하세요.</p>

            <label for="accountType">계좌 유형</label>
            <select id="accountType" name="accountType" required>
                <option value="">계좌 유형 선택</option>
                <option value="checking">입출금 계좌</option>
                <option value="saving">적금계좌</option>
            </select>
            <p class="desc">계좌 유형에 따라 이자율과 서비스가 다를 수 있습니다.</p>

            <label for="initialBalance">초기 입금액</label>
            <input type="number" id="initialBalance" name="initialBalance" value="0" min="0" required>
            <p class="desc">계좌 개설 시 입금할 금액을 입력하세요.</p>

            <button type="submit">계좌 개설</button>
        </form>
    </div>
</div>
</body>
</html>

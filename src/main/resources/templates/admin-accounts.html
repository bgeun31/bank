<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 계좌 관리</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .admin-card {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            max-width: 1000px;
            margin: 40px auto;
        }

        .admin-card h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-green {
            background: #4caf50;
        }

        .badge-red {
            background: #f44336;
        }

        .btn-toggle {
            padding: 6px 12px;
            font-size: 12px;
            border: none;
            background: #444;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <h2>🔒 안전한 은행</h2>
        <a href="/dashboard">📊 대시보드</a>
        <a href="/accounts">💳 계좌</a>
        <a href="/transfer">🔁 이체</a>
        <a href="/transactions">📉 거래 내역</a>
        <a href="/settings">⚙️ 설정</a>
    </aside>

    <main class="main">
        <div class="admin-card">
            <h2>📋 전체 계좌 관리</h2>
            <table>
                <thead>
                <tr>
                    <th>번호</th>
                    <th>이름</th>
                    <th>계좌번호</th>
                    <th>소유자</th>
                    <th>상태</th>
                    <th>토글</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="acc, iterStat : ${accounts}">
                    <td th:text="${iterStat.count}">1</td>
                    <td th:text="${acc.accountName}">test</td>
                    <td th:text="${acc.accountNumber}">123-456-789</td>
                    <td th:text="${acc.username}">user1</td>
                    <td>
                        <span th:if="${acc.active}" class="badge badge-green">활성</span>
                        <span th:unless="${acc.active}" class="badge badge-red">비활성</span>
                    </td>
                    <td>
                        <form method="post" action="/admin/accounts/toggle">
                            <input type="hidden" name="id" th:value="${acc.id}">
                            <button type="submit" class="btn-toggle">변경</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>

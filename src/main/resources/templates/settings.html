<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <title>설정</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .settings-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
            max-width: 600px;
            margin: 0 auto;
        }
        .settings-card h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }
        .settings-card label {
            font-weight: bold;
        }
        .settings-card input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .settings-card button {
            background: #000;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <h2>🔒 안전한 은행</h2>
        <a href="/dashboard">📊 대시보드</a>
        <a href="/accounts">💳 계좌</a>
        <a href="/transfer">🔁 이체</a>
        <a href="/transactions">📉 거래 내역</a>
        <a href="/deposit">📤 입금</a>
        <a href="/withdraw">📥 출금</a>
        <a href="/settings" class="active">⚙️ 설정</a>
    </aside>

    <main class="main">
        <div class="settings-card">
            <h2>사용자 설정</h2>

            <form method="post" action="/settings/update-password">
                <label for="username">사용자 이름</label>
                <input type="text" id="username" name="username" th:value="${username}" readonly>

                <label for="password">새 비밀번호</label>
                <input type="password" id="password" name="password" placeholder="새 비밀번호 입력">

                <button type="submit">비밀번호 변경</button>
            </form>

            <!-- 관리자 전용 섹션 -->
            <div class="admin-section" sec:authorize="hasRole('ADMIN')">
                <h3 style="margin-top: 30px;">🔐 관리자 기능</h3>
                <a href="/admin/accounts"><button class="btn" style="margin-top: 10px;">계좌 관리</button></a>
            </div>

            <!-- 로그아웃 -->
            <form method="post" action="/logout" style="margin-top: 20px;">
                <button type="submit" class="btn btn-danger" style="background:#f44336;">로그아웃</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>

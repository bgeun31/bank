<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body {
            font-family: Arial, sans-serif; margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; background-color: #f7f7f7;
        }
        .container {
            background: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 400px;
        }
        h2 {
            text-align: center; margin-bottom: 30px;
        }
        input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #ccc; border-radius: 5px;
        }
        button {
            width: 100%; padding: 12px; background-color: black;
            color: white; border: none; border-radius: 5px;
            font-size: 16px;
        }
        .back {
            margin-top: 15px; text-align: center;
        }
        .back a {
            color: #333; text-decoration: none;
        }
        .error {
            color: red; font-size: 14px; text-align: center; margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>로그인</h2>
    <form th:action="@{/login}" method="post">
        <div th:if="${param.error}" class="error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        <input type="text" name="username" placeholder="아이디" required />
        <input type="password" name="password" placeholder="비밀번호" required />
        <button type="submit">로그인</button>
    </form>
    <div class="back">
        <a th:href="@{/register}">계정이 없으신가요? 회원가입</a>
    </div>
</div>

</body>
</html>

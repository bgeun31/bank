<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>출금</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 사이드바 -->
    <aside class="sidebar">
        <h2>🔒 안전한 은행</h2>
        <a href="/sskm0116/dashboard">📊 대시보드</a>
        <a href="/sskm0116/accounts">💳 계좌</a>
        <a href="/sskm0116/transfer">🔁 이체</a>
        <a href="/sskm0116/transactions">📉 거래 내역</a>
        <a href="/sskm0116/deposit">📤 입금</a>
        <a href="/sskm0116/withdraw" class="active">📥 출금</a>
        <a href="/sskm0116/settings">⚙️ 설정</a>
    </aside>

    <!-- 메인 -->
    <main class="main">
        <h1 class="section-title">출금</h1>
        <p class="text-sm text-gray-500">선택한 계좌에서 금액을 출금합니다.</p>

        <div class="card" style="max-width: 600px;">
            <div class="card-title">출금 정보</div>
            <p class="text-sm text-gray-500">출금할 계좌와 금액을 입력하세요.</p>

            <form method="post" action="/sskm0116/withdraw">
                <label for="account">출금 계좌</label>
                <select name="accountNumber" id="account" class="input" required>
                    <option value="">계좌 선택</option>
                    <option th:each="acc : ${accounts}"
                            th:value="${acc.accountNumber}"
                            th:text="${acc.accountName + ' (' + acc.accountNumber + ')'}">
                        주계좌 (000-000-000000)
                    </option>
                </select>

                <label for="amount">출금 금액</label>
                <input type="number" id="amount" name="amount" class="input" placeholder="10000" required>

                <label for="description">내용</label>
                <textarea id="description" name="description" class="input" placeholder="출금 사유를 입력하세요."></textarea>

                <button type="submit" class="input" style="background: black; color: white;">출금하기</button>
            </form>
        </div>
    </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>안전한 은행</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; border-bottom: 1px solid #ccc;
        }
        .navbar h1 { margin: 0; font-size: 20px; }
        .navbar .nav-links a {
            margin-left: 10px; text-decoration: none; padding: 8px 14px;
            background: black; color: white; border-radius: 5px;
        }
        .hero {
            text-align: center; padding: 80px 20px;
        }
        .hero h2 { font-size: 36px; margin-bottom: 20px; }
        .hero p { font-size: 16px; color: #555; margin-bottom: 30px; }
        .hero a {
            padding: 12px 24px; background: black; color: white;
            text-decoration: none; border-radius: 5px;
        }
        .services {
            display: flex; justify-content: center; padding: 40px 20px; gap: 20px;
        }
        .service-card {
            border: 1px solid #ccc; padding: 20px; width: 250px;
            text-align: center; border-radius: 10px;
        }
        .service-card h3 { margin: 10px 0; }
        .footer {
            text-align: center; font-size: 12px; padding: 20px;
            border-top: 1px solid #ccc; color: #777;
        }
    </style>
</head>
<body>

<!-- 상단 네비게이션 -->
<div class="navbar">
    <h1>🛡️ 안전한 은행</h1>
    <div class="nav-links">
        <a th:href="@{/login}">로그인</a>
        <a th:href="@{/register}">회원가입</a>
    </div>
</div>

<!-- 메인 슬로건 -->
<div class="hero">
    <h2>안전하고 편리한 온라인 뱅킹</h2>
    <p>언제 어디서나 빠르고 간편한 금융 서비스를 누리세요.</p>
    <a th:href="@{/dashboard}">시작하기</a>
</div>

<!-- 주요 서비스 -->
<div class="services">
    <div class="service-card">
        <div>💳</div>
        <h3>계좌 관리</h3>
        <p>계좌 생성, 입출금, 잔액 확인 등 계좌 서비스를 제공합니다.</p>
    </div>
    <div class="service-card">
        <div>🔁</div>
        <h3>이체 서비스</h3>
        <p>간편하고 안전한 이체 기능을 제공합니다.</p>
    </div>
    <div class="service-card">
        <div>📈</div>
        <h3>거래 내역</h3>
        <p>모든 거래 내역을 한눈에 확인하고 관리하세요.</p>
    </div>
</div>

<!-- 푸터 -->
<div class="footer">
    © 2025 안전한 은행. 모든 권리 보유.
</div>

</body>
</html>
